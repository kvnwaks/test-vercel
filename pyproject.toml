[project]
name = "kvnwaks"
version = "0.1.0"
readme = "README.md"
authors = [{ name = "Kevin Wakhisi", email = "kevin@treeolive.tech" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "django>=6.1.2",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "psycopg[binary,pool]>=3.3.6",
    "vercel>=0.12.0",
    "django-http-compression[brotli]>=1.4.0",
    "django-minify-html>=1.14.0",
    "django-browser-reload>=1.21.0",
    
    # rest framework
    "djangorestframework>=3.18.3",
    "django-filter>=26.2",
    "markdown>=3.11.2",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "djlint>=1.46.6",
    "poethepoet>=0.49.0",
]

[tool.uv]
preview-features = ["format-command", "check-command"]

[tool.djlint]
format_css = true
format_js = true
blank_line_before_tag = "block,list"
blank_line_after_tag = "endblock,endlist"
ignore = "H016,H030,H031"

[tool.ruff]
exclude = ["*/migrations/*"]

[tool.poe.tasks.format]
help = "Format Python, HTML, CSS and JS"
sequence = [{ cmd = "uv format" }, { cmd = "djlint . --reformat" }]

[tool.poe.tasks.lint]
help = "Run all linters and Django checks"
sequence = [
    { cmd = "uv lock --check" },
    { cmd = "uv check" },
    { cmd = "python manage.py check" },
    { cmd = "python manage.py makemigrations --check --dry-run" },
    { cmd = "djlint . --lint" },
]

[tool.poe.tasks.test]
help = "Run test suite"
cmd = "python manage.py test"

[tool.poe.tasks.ci]
help = "Run everything used in CI"
sequence = [{ ref = "lint" }, { ref = "test" }]
